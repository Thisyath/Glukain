services:
  db:
    image: mysql:8
    container_name: glukain-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: glukain
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: glukain-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-password}@db:3306/glukain
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-secret-key-32chars-minimum-required}
      JWT_ACCESS_TTL: 900
      REFRESH_TTL_DAYS: 7
      FRONTEND_ORIGIN: http://localhost:8080
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: glukain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data: